<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Interactive Particles - index</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --bg:#e6e7e8;
      --panel:#d1d3d4;
      --black:#0b0b0b;
      --white:#ffffff;
      --red:#d62828;
      --muted:#7a7a7a;
      --font: "Segoe UI", Roboto, system-ui, -apple-system, "Helvetica Neue", Arial;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:var(--font);background:var(--bg);color:var(--black)}
    .container{max-width:1200px;margin:18px auto;padding:12px}
    .header{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .title{font-size:1.15rem;font-weight:700;color:var(--black)}
    .links a{color:var(--black);text-decoration:none;padding:6px 10px;border-radius:6px;background:transparent;border:1px solid rgba(0,0,0,0.06)}
    .links a:hover{background:var(--black);color:var(--white)}
    .canvas-wrap{background:linear-gradient(180deg, rgba(11,11,11,0.02), rgba(0,0,0,0.04)); padding:12px;border-radius:10px;box-shadow:0 8px 30px rgba(11,11,11,0.08)}
    canvas{display:block;width:100%;height:70vh;border-radius:8px;background:var(--panel)}
    .controls{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
    .control label{font-size:0.9rem;color:var(--muted);margin-right:6px}
    .btn{background:var(--black);border:1px solid rgba(255,255,255,0.06);color:var(--white);padding:8px 12px;border-radius:8px;cursor:pointer}
    .btn.secondary{background:transparent;color:var(--black);border:1px solid rgba(0,0,0,0.08)}
    .btn:hover{opacity:0.95}
    .small{font-size:0.85rem;color:var(--muted)}
    .accent{color:var(--red);font-weight:600}
    .footer{margin-top:12px;font-size:0.85rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    @media (max-width:640px){
      .header{flex-direction:column;align-items:flex-start}
      canvas{height:55vh}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <div class="title">Interactive Bouncing Particle System</div>
        <div class="small">Stage 3: Mouse interaction, smooth sizing, responsive canvas — <span class="accent">index</span></div>
      </div>
      <div class="links">
        <a class="secondary" href="I.htm">Second Page</a>
      </div>
    </div>

    <div class="canvas-wrap" style="margin-top:12px">
      <canvas id="canvas"></canvas>

      <div class="controls">
        <div>
          <label class="small">Particles</label>
          <input id="count" type="range" min="20" max="400" value="140" />
          <span id="countVal" class="small">140</span>
        </div>

        <button id="regen" class="btn">Regenerate</button>
        <button id="pause" class="btn">Pause</button>
        <div style="margin-left:auto" class="small">Move mouse near particles to enlarge them</div>
      </div>
    </div>

    <div class="footer">
      <div class="small">Instructor: Professor Pacheco</div>
      <div class="small">File: index.htm</div>
    </div>
  </div>

  <script>
    // index.htm — interactive particle system (red / black / white theme)

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const controls = {
      countRange: document.getElementById('count'),
      countVal: document.getElementById('countVal'),
      regenBtn: document.getElementById('regen'),
      pauseBtn: document.getElementById('pause')
    };

    let particles = [];
    let running = true;
    const mouse = { x: undefined, y: undefined };

    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const w = Math.max(1, Math.floor(rect.width * ratio));
      const h = Math.max(1, Math.floor(rect.height * ratio));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
        createParticles(parseInt(controls.countRange.value, 10));
      }
    }
    window.addEventListener('resize', () => {
      clearTimeout(window._resizeTO);
      window._resizeTO = setTimeout(resizeCanvas, 120);
    });

    function rand(min, max) { return Math.random() * (max - min) + min; }
    function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
    function paletteColor() {
      const r = Math.random();
      if (r < 0.55) return getComputedStyle(document.documentElement).getPropertyValue('--red').trim();
      if (r < 0.85) return getComputedStyle(document.documentElement).getPropertyValue('--black').trim();
      return getComputedStyle(document.documentElement).getPropertyValue('--white').trim();
    }

    class Particle {
      constructor(x, y, r, color, dx, dy) {
        this.x = x;
        this.y = y;
        this.r = r * (window.devicePixelRatio || 1);
        this.baseR = this.r;
        this.color = color;
        this.dx = dx * (window.devicePixelRatio || 1);
        this.dy = dy * (window.devicePixelRatio || 1);
        this.targetR = this.r;
      }

      draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0.5, this.r), 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        if (this.color !== getComputedStyle(document.documentElement).getPropertyValue('--white').trim()) {
          ctx.beginPath();
          ctx.globalAlpha = 0.12;
          ctx.arc(this.x - this.r * 0.25, this.y - this.r * 0.25, Math.max(0.5, this.r * 0.45), 0, Math.PI * 2);
          ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--white').trim();
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      update(bounds) {
        this.x += this.dx;
        this.y += this.dy;

        if (this.x - this.r <= 0) {
          this.x = this.r;
          this.dx *= -1;
        } else if (this.x + this.r >= bounds.width) {
          this.x = bounds.width - this.r;
          this.dx *= -1;
        }
        if (this.y - this.r <= 0) {
          this.y = this.r;
          this.dy *= -1;
        } else if (this.y + this.r >= bounds.height) {
          this.y = bounds.height - this.r;
          this.dy *= -1;
        }

        if (mouse.x !== undefined && mouse.y !== undefined) {
          const dx = this.x - mouse.x;
          const dy = this.y - mouse.y;
          const dist = Math.hypot(dx, dy);
          const proximity = 60 * (window.devicePixelRatio || 1);
          if (dist < proximity) {
            const grow = Math.min(this.baseR * 3, this.baseR + (proximity - dist) * 0.25);
            this.targetR = grow;
          } else {
            this.targetR = this.baseR;
          }
        } else {
          this.targetR = this.baseR;
        }

        const lerp = 0.12;
        this.r += (this.targetR - this.r) * lerp;
      }
    }

    function createParticles(count = 140) {
      particles = [];
      const ratio = window.devicePixelRatio || 1;
      const w = canvas.width;
      const h = canvas.height;
      for (let i = 0; i < count; i++) {
        const r = rand(4, 14);
        const rr = r * ratio;
        const x = rand(rr, w - rr);
        const y = rand(rr, h - rr);
        const dx = rand(-1.8, 1.8);
        const dy = rand(-1.8, 1.8);
        const color = paletteColor();
        particles.push(new Particle(x, y, r, color, dx, dy));
      }
    }

    function animate() {
      // draw panel background
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--panel').trim();
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const bounds = { width: canvas.width, height: canvas.height };
      for (const p of particles) {
        p.update(bounds);
        p.draw(ctx);
      }

      if (running) requestAnimationFrame(animate);
    }

    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      const ratio = (canvas.width / rect.width) || 1;
      return {
        x: (e.clientX - rect.left) * ratio,
        y: (e.clientY - rect.top) * ratio
      };
    }

    canvas.addEventListener('mousemove', (e) => {
      const pos = getMousePos(e);
      mouse.x = pos.x;
      mouse.y = pos.y;
    });

    canvas.addEventListener('mouseleave', () => {
      mouse.x = undefined;
      mouse.y = undefined;
    });

    controls.countRange.addEventListener('input', (e) => {
      controls.countVal.textContent = e.target.value;
    });
    controls.regenBtn.addEventListener('click', () => {
      createParticles(parseInt(controls.countRange.value, 10));
    });
    controls.pauseBtn.addEventListener('click', () => {
      running = !running;
      controls.pauseBtn.textContent = running ? 'Pause' : 'Resume';
      if (running) animate();
    });

    (function init() {
      canvas.style.width = '100%';
      canvas.style.height = '70vh';
      resizeCanvas();
      createParticles(parseInt(controls.countRange.value, 10));
      animate();
    })();
  </script>
</body>
</html>
